<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <title>Preview runtime identity</title>
  <pre id="result">Checking preview runtime identity…</pre>
  <script>
    fetch('/api/internal/preview-firebase-runtime-identity', { cache: 'no-store' })
      .then(async (response) => {
        document.querySelector('#result').textContent = await response.text()
      })
      .catch(() => {
        document.querySelector('#result').textContent = 'Preview runtime identity unavailable'
      })
  </script>
</html>
