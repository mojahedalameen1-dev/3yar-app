<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staging test account helper</title>
<body>
  <main>
    <h1>مساعد حساب اختبار Staging مؤقت</h1>
    <form id="test-account-form">
      <label>العملية
        <select name="operation" required>
          <option value="create">إنشاء</option>
          <option value="delete">حذف</option>
        </select>
      </label>
      <label>البريد الصناعي
        <input name="email" type="email" autocomplete="off" required>
      </label>
      <label>كلمة مرور الاختبار
        <input name="password" type="password" autocomplete="new-password">
      </label>
      <button type="submit">تنفيذ</button>
    </form>
    <p id="result" role="status" aria-live="polite"></p>
  </main>
  <script type="module">
    const form = document.querySelector('#test-account-form')
    const result = document.querySelector('#result')
    form.addEventListener('submit', async event => {
      event.preventDefault()
      const button = form.querySelector('button')
      button.disabled = true
      result.textContent = 'جارٍ التنفيذ…'
      try {
        const response = await fetch('/api/internal/product-core-staging-test-user', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            operation: form.elements.operation.value,
            email: form.elements.email.value,
            password: form.elements.password.value
          })
        })
        const body = await response.json()
        if (!response.ok || body.ok !== true) throw new Error(body.error || 'FAILED')
        result.textContent = form.elements.operation.value === 'create' ? 'تم إنشاء حساب الاختبار بنجاح.' : 'تم حذف حساب الاختبار.'
      } catch (error) {
        result.textContent = `تعذر إكمال العملية (${error.message}).`
      } finally {
        form.elements.password.value = ''
        button.disabled = false
      }
    })
  </script>
</body>
</html>
