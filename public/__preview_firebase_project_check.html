<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <title>Preview environment check</title>
  <pre id="result">Checking preview environment…</pre>
  <script>
    fetch('/api/internal/preview-firebase-project-check', { cache: 'no-store' })
      .then(async (response) => {
        const text = await response.text()
        document.querySelector('#result').textContent = text
      })
      .catch(() => {
        document.querySelector('#result').textContent = 'Preview check unavailable'
      })
  </script>
</html>
